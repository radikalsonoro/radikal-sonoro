# ==========================================
# 4. CONCIERTOS DE SALAS (MADRID)
# ==========================================
def extraer_gruta77():
    print("Extrayendo conciertos de Gruta 77...")
    url = "https://gruta77.com/programacion-eventos-gruta77-madrid/"
    try:
        res = requests.get(url, headers=HEADERS, timeout=10)
        if res.status_code == 200:
            soup = BeautifulSoup(res.text, "html.parser")
            eventos = soup.find_all(["article", "div"], class_=lambda c: c and ("event" in c.lower() or "post" in c.lower()))
            
            for ev in eventos:
                titulo_el = ev.find(["h2", "h3", "a"])
                if not titulo_el:
                    continue
                titulo = titulo_el.get_text(strip=True)
                
                enlace = titulo_el.get("href") if titulo_el.name == "a" else None
                if not enlace and ev.find("a"):
                    enlace = ev.find("a").get("href")
                
                fecha_el = ev.find(class_=lambda c: c and ("date" in c.lower() or "fecha" in c.lower() or "time" in c.lower()))
                fecha = fecha_el.get_text(strip=True) if fecha_el else "Fecha por confirmar"

                if titulo and len(titulo) > 3:
                    todos_los_conciertos.append({
                        "sala": "Gruta 77",
                        "titulo": titulo,
                        "fecha": fecha,
                        "enlace": enlace or url
                    })
    except Exception as e:
        print(f"Error al extraer Gruta 77: {e}")

def extraer_la_trinchera():
    print("Extrayendo conciertos de La Trinchera...")
    url = "https://salatrinchera.com/tag/conciertos/"
    try:
        res = requests.get(url, headers=HEADERS, timeout=10)
        if res.status_code == 200:
            soup = BeautifulSoup(res.text, "html.parser")
            articulos = soup.find_all("article")
            
            for art in articulos:
                titulo_el = art.find(["h1", "h2", "h3"])
                if not titulo_el:
                    continue
                titulo = titulo_el.get_text(strip=True)
                
                link_el = art.find("a")
                enlace = link_el.get("href") if link_el else url
                
                fecha_el = art.find("time") or art.find(class_=lambda c: c and ("date" in c.lower() or "entry-date" in c.lower()))
                fecha = fecha_el.get_text(strip=True) if fecha_el else "Próximamente"

                if titulo:
                    todos_los_conciertos.append({
                        "sala": "La Trinchera",
                        "titulo": titulo,
                        "fecha": fecha,
                        "enlace": enlace
                    })
    except Exception as e:
        print(f"Error al extraer La Trinchera: {e}")

def extraer_wurlitzer():
    print("Extrayendo conciertos de Wurlitzer Ballroom...")
    url = "https://www.wurlitzerballroom.com/"
    try:
        res = requests.get(url, headers=HEADERS, timeout=10)
        if res.status_code == 200:
            soup = BeautifulSoup(res.text, "html.parser")
            eventos = soup.find_all(["article", "div", "section"], class_=lambda c: c and ("event" in c.lower() or "show" in c.lower() or "concierto" in c.lower()))
            if not eventos:
                eventos = soup.find_all(["div", "li"], class_=lambda c: c and "item" in c.lower())
            
            for ev in eventos:
                titulo_el = ev.find(["h2", "h3", "h4", "a"])
                if not titulo_el:
                    continue
                titulo = titulo_el.get_text(strip=True)
                
                enlace = titulo_el.get("href") if titulo_el.name == "a" else None
                if not enlace and ev.find("a"):
                    enlace = ev.find("a").get("href")
                
                fecha_el = ev.find(class_=lambda c: c and ("date" in c.lower() or "fecha" in c.lower() or "time" in c.lower()))
                fecha = fecha_el.get_text(strip=True) if fecha_el else "Próximamente"

                if titulo and len(titulo) > 2:
                    todos_los_conciertos.append({
                        "sala": "Wurlitzer Ballroom",
                        "titulo": titulo,
                        "fecha": fecha,
                        "enlace": enlace or url
                    })
    except Exception as e:
        print(f"Error al extraer Wurlitzer Ballroom: {e}")

