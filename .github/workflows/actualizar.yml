# ==========================================
# 2. VÍDEOS (BÚSQUEDA AUTOMÁTICA EN YOUTUBE)
# ==========================================
def actualizar_videos():
    print("Buscando vídeos de la escena automáticamente...")
    url_busqueda = "https://www.youtube.com/results?search_query=concierto+madrid+rock+punk"
    try:
        res = requests.get(url_busqueda, headers=HEADERS, timeout=10)
        if res.status_code == 200:
            soup = BeautifulSoup(res.text, "html.parser")
            video_ids = re.findall(r"watch\?v=([a-zA-Z0-9_-]{11})", res.text)
            ids_unicas = list(dict.fromkeys(video_ids))
            
            for vid in ids_unicas[:6]: # Guardar los primeros 6 vídeos encontrados
                todos_los_videos.append({
                    "titulo": "Vídeo destacado de la escena",
                    "url": f"https://www.youtube.com/watch?v={vid}",
                    "embed_url": f"https://www.youtube.com/embed/{vid}"
                })
            print(f"Encontrados {len(todos_los_videos)} vídeos automáticamente.")
    except Exception as e:
        print(f"Error al buscar vídeos: {e}")


