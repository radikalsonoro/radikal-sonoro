# ==========================================
# 3. GUARDADO DE DATOS
# ==========================================
def guardar_conciertos():
    os.makedirs("data", exist_ok=True)
    archivo_destino = "data/conciertos.json"
    
    with open(archivo_destino, "w", encoding="utf-8") as f:
        json.dump(todos_los_conciertos, f, ensure_ascii=False, indent=2)
    print(f"Conciertos guardados correctamente en {archivo_destino}")


