name: Crear APK firmada de Radikal Sonoro

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar secretos de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Faltan los secretos de firma Android. Consulta ANDROID-SIGNING.md y configura los cuatro secretos del repositorio."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radikal-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/radikal-release.jks" >> "$GITHUB_ENV"

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aceptar licencias e instalar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Compilar APK de lanzamiento firmada
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Preparar archivo descargable
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk radikal-sonoro.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose radikal-sonoro.apk

      - name: Publicar APK en una versión de GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Radikal Sonoro Android v1.0.8
          generate_release_notes: true
          files: radikal-sonoro.apk
